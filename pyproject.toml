[project]
name = "saga-attack"
version = "0.1.0"
description = "Stage-wise Attention-Guided Attack: main-method research release"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.1",
  "qwen-vl-utils==0.0.14",
  "accelerate==1.11.0",
  "numpy==2.2.4",
  "pillow==11.3.0",
  "loguru==0.7.3",
  "tqdm==4.67.1",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
